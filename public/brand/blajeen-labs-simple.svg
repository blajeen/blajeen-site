<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 220" role="img" aria-labelledby="title desc">
  <title id="title">Blajeen Labs</title>
  <desc id="desc">Assinatura tipográfica simples da Blajeen Labs, sem símbolos ou olhos.</desc>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#d8efff"/>
      <stop offset="1" stop-color="#8fffd5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70d8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#70d8ff"/>
      <stop offset="1" stop-color="#91ffd6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dy="5" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.01 0 0 0 0 0.04 0 0 0 0 0.08 0 0 0 .82 0" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <text x="490" y="125" text-anchor="middle" fill="url(#word)"
      font-family="Bahnschrift, Arial, sans-serif" font-size="112" font-weight="700"
      letter-spacing="9">BLAJEEN</text>
    <rect x="48" y="158" width="318" height="4" rx="2" fill="url(#accent)"/>
    <rect x="614" y="158" width="318" height="4" rx="2" fill="url(#accent)"/>
    <text x="490" y="181" text-anchor="middle" fill="#f6fbff"
      font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="600"
      letter-spacing="18">LABS</text>
  </g>
</svg>
